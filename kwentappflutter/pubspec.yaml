name: kwentappflutter
description: "Kwentapp — a mobile-first blog & forum app. Flutter · Provider · go_router · Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  provider: ^6.1.1
  go_router: ^17.0.0
  image_picker: ^1.1.0
  shared_preferences: ^2.5.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#FAFAF9"
    theme_color: "#4F46E5"

flutter_native_splash:
  color: "#FAFAF9"
  color_dark: "#0C0A1D"
  image: assets/branding/splash_logo.png
  image_dark: assets/branding/splash_logo_dark.png
  android_12:
    color: "#FAFAF9"
    color_dark: "#0C0A1D"
    image: assets/branding/splash_logo_android12.png
    image_dark: assets/branding/splash_logo_android12_dark.png
  android: true
  ios: true
  web: true
